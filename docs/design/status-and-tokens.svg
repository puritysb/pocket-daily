<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', sans-serif">
  <title>Pocket Daily status tones and layout tokens</title>
  <defs>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #1B1F1D; }
      .t { font-size: 12px; fill: #4A4F4C; }
      .m { font-size: 11px; fill: #6B6F6C; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
      .k { font-size: 11px; fill: #8A6A3E; font-weight: 600; letter-spacing: 0.04em; }
      .card { fill: #FFFFFF; stroke: rgba(0,0,0,0.11); }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#F3F1EC"/>

  <text x="32" y="44" font-size="22" font-weight="600" fill="#1B1F1D">상태 표현</text>
  <text x="140" y="44" class="t">문구 · 기호 · 색은 항상 함께 · 글자 대비는 종이 바탕 기준 4.5:1 이상 (밝은 / 어두운)</text>

  <!-- Light row -->
  <g transform="translate(32,70)">
    <text x="0" y="0" class="k">LIGHT · workspace #F3F1EC</text>
    <!-- neutral -->
    <g transform="translate(0,14)">
      <rect class="card" width="182" height="96" rx="12"/>
      <circle cx="22" cy="26" r="8" fill="none" stroke="#6B6F6C" stroke-width="1.6"/>
      <rect x="21" y="24" width="2" height="7" fill="#6B6F6C"/><circle cx="22" cy="21" r="1.2" fill="#6B6F6C"/>
      <text x="38" y="30" class="h" font-size="13">정보</text>
      <text x="16" y="56" font-size="12" fill="#6B6F6C">Demo · nothing is sent</text>
      <text x="16" y="82" class="m">.neutral · secondary</text>
    </g>
    <!-- progress -->
    <g transform="translate(194,14)">
      <rect class="card" width="182" height="96" rx="12"/>
      <circle cx="22" cy="26" r="8" fill="none" stroke="#C7751F" stroke-width="1.6" stroke-dasharray="3 2.4"/>
      <text x="38" y="30" class="h" font-size="13">진행 · 미적용</text>
      <text x="16" y="56" font-size="12" fill="#1B1F1D">Applying on the reader…</text>
      <text x="16" y="82" class="m">accent #C7751F · 기호만</text>
    </g>
    <!-- onReader -->
    <g transform="translate(388,14)">
      <rect class="card" width="182" height="96" rx="12"/>
      <circle cx="22" cy="26" r="9" fill="#C7751F"/>
      <rect x="20" y="20" width="4" height="10" rx="2" fill="#fff"/>
      <text x="38" y="30" class="h" font-size="13">다음은 리더에서</text>
      <text x="16" y="56" font-size="12" fill="#1B1F1D">Confirm install on reader</text>
      <text x="16" y="82" class="m">.onReader · accent</text>
    </g>
    <!-- success -->
    <g transform="translate(582,14)">
      <rect class="card" width="182" height="96" rx="12"/>
      <circle cx="22" cy="26" r="9" fill="#217847"/>
      <path d="M17.5 26.5 l3 3 l6 -6.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="30" class="h" font-size="13">확인됨</text>
      <text x="16" y="56" font-size="12" fill="#217847">Up to date with the reader</text>
      <text x="16" y="82" class="m">signal #217847 · 4.9</text>
    </g>
    <!-- caution -->
    <g transform="translate(776,14)">
      <rect class="card" width="182" height="96" rx="12"/>
      <path d="M22 17 l9 16 h-18 z" fill="none" stroke="#A85400" stroke-width="1.8" stroke-linejoin="round"/>
      <rect x="21" y="23" width="2" height="5" fill="#A85400"/><circle cx="22" cy="30.5" r="1.1" fill="#A85400"/>
      <text x="38" y="30" class="h" font-size="13">확인 필요</text>
      <text x="16" y="56" font-size="12" fill="#A85400">Changed on the reader</text>
      <text x="16" y="82" class="m">caution #A85400 · 4.7</text>
    </g>
    <!-- critical -->
    <g transform="translate(970,14)">
      <rect class="card" width="166" height="96" rx="12"/>
      <path d="M22 17 l9 16 h-18 z" fill="#B82621" stroke="#B82621" stroke-width="1.8" stroke-linejoin="round"/>
      <rect x="21" y="23" width="2" height="5" fill="#fff"/><circle cx="22" cy="30.5" r="1.1" fill="#fff"/>
      <text x="38" y="30" class="h" font-size="13">실패</text>
      <text x="16" y="56" font-size="12" fill="#B82621">Not applied · Reconnect</text>
      <text x="16" y="82" class="m">critical #B82621 · 5.6</text>
    </g>
  </g>

  <!-- Dark row -->
  <g transform="translate(32,206)">
    <rect x="-8" y="-18" width="1150" height="138" rx="16" fill="#1D1C1A"/>
    <text x="0" y="0" class="k" fill="#D9A866">DARK · workspace #1D1C1A</text>
    <g font-size="12">
      <g transform="translate(0,14)"><rect width="182" height="96" rx="12" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <circle cx="22" cy="26" r="8" fill="none" stroke="#9C9B94" stroke-width="1.6"/><rect x="21" y="24" width="2" height="7" fill="#9C9B94"/><circle cx="22" cy="21" r="1.2" fill="#9C9B94"/><text x="38" y="30" font-weight="600" font-size="13" fill="#E7E6DE">정보</text><text x="16" y="56" fill="#9C9B94">Demo · nothing is sent</text><text x="16" y="82" class="m" fill="#9C9B94">secondary</text></g>
      <g transform="translate(194,14)"><rect width="182" height="96" rx="12" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <circle cx="22" cy="26" r="8" fill="none" stroke="#E39945" stroke-width="1.6" stroke-dasharray="3 2.4"/><text x="38" y="30" font-weight="600" font-size="13" fill="#E7E6DE">진행 · 미적용</text><text x="16" y="56" fill="#E7E6DE">Applying on the reader…</text><text x="16" y="82" class="m" fill="#9C9B94">accent #E39945 · 기호만</text></g>
      <g transform="translate(388,14)"><rect width="182" height="96" rx="12" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <circle cx="22" cy="26" r="9" fill="#E39945"/><rect x="20" y="20" width="4" height="10" rx="2" fill="#1D1C1A"/><text x="38" y="30" font-weight="600" font-size="13" fill="#E7E6DE">다음은 리더에서</text><text x="16" y="56" fill="#E7E6DE">Confirm install on reader</text><text x="16" y="82" class="m" fill="#9C9B94">accent</text></g>
      <g transform="translate(582,14)"><rect width="182" height="96" rx="12" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <circle cx="22" cy="26" r="9" fill="#61BA85"/><path d="M17.5 26.5 l3 3 l6 -6.5" fill="none" stroke="#1D1C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="30" font-weight="600" font-size="13" fill="#E7E6DE">확인됨</text><text x="16" y="56" fill="#61BA85">Up to date with the reader</text><text x="16" y="82" class="m" fill="#9C9B94">signal #61BA85 · 7.2</text></g>
      <g transform="translate(776,14)"><rect width="182" height="96" rx="12" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <path d="M22 17 l9 16 h-18 z" fill="none" stroke="#F59E4D" stroke-width="1.8" stroke-linejoin="round"/><rect x="21" y="23" width="2" height="5" fill="#F59E4D"/><circle cx="22" cy="30.5" r="1.1" fill="#F59E4D"/><text x="38" y="30" font-weight="600" font-size="13" fill="#E7E6DE">확인 필요</text><text x="16" y="56" fill="#F59E4D">Changed on the reader</text><text x="16" y="82" class="m" fill="#9C9B94">caution #F59E4D · 8.0</text></g>
      <g transform="translate(970,14)"><rect width="166" height="96" rx="12" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <path d="M22 17 l9 16 h-18 z" fill="#FF7A6B" stroke="#FF7A6B" stroke-width="1.8" stroke-linejoin="round"/><rect x="21" y="23" width="2" height="5" fill="#1D1C1A"/><circle cx="22" cy="30.5" r="1.1" fill="#1D1C1A"/><text x="38" y="30" font-weight="600" font-size="13" fill="#E7E6DE">실패</text><text x="16" y="56" fill="#FF7A6B">Not applied · Reconnect</text><text x="16" y="82" class="m" fill="#9C9B94">critical #FF7A6B · 6.7</text></g>
    </g>
  </g>

  <text x="32" y="372" class="t">하지 않는다: 체크 기호 + 주의 색 · 정보 기호 + 경고 색 · 시스템 주황 글자(밝은 종이 바탕 1.95:1) · 색만 바뀌는 상태 점</text>

  <!-- Tokens -->
  <text x="32" y="420" font-size="22" font-weight="600" fill="#1B1F1D">간격 · 모서리 · 행동 위계</text>

  <g transform="translate(32,446)">
    <text x="0" y="0" class="k">SPACING · 4pt 배수</text>
    <g transform="translate(0,14)">
      <rect y="0" width="4" height="40" fill="#C7751F" opacity="0.55"/><text x="0" y="58" class="m">4</text>
      <rect x="30" y="0" width="8" height="40" fill="#C7751F" opacity="0.55"/><text x="30" y="58" class="m">8</text>
      <rect x="64" y="0" width="12" height="40" fill="#C7751F" opacity="0.55"/><text x="64" y="58" class="m">12</text>
      <rect x="102" y="0" width="16" height="40" fill="#C7751F" opacity="0.55"/><text x="102" y="58" class="m">16</text>
      <rect x="144" y="0" width="20" height="40" fill="#C7751F" opacity="0.55"/><text x="144" y="58" class="m">20</text>
      <rect x="190" y="0" width="24" height="40" fill="#C7751F" opacity="0.55"/><text x="190" y="58" class="m">24</text>
    </g>
    <text x="0" y="96" class="t">요소 안 4·8 · 묶음 안 8–12</text>
    <text x="0" y="114" class="t">카드 여백·섹션 16 · 화면 20–24</text>
  </g>

  <g transform="translate(320,446)">
    <text x="0" y="0" class="k">RADIUS · 역할로 고른다</text>
    <rect class="card" x="0" y="14" width="120" height="74" rx="12"/>
    <text x="12" y="38" class="h" font-size="13">카드 12</text>
    <rect x="12" y="52" width="96" height="26" rx="8" fill="#F9F8F4" stroke="rgba(0,0,0,0.11)"/>
    <text x="22" y="69" class="t" font-size="11">컨트롤·행 8</text>
    <rect x="140" y="40" width="96" height="5" rx="2.5" fill="#1B1F1D" opacity="0.1"/>
    <rect x="140" y="40" width="40" height="5" rx="2.5" fill="#C7751F"/>
    <text x="140" y="64" class="t" font-size="11">진행 막대 = 캡슐</text>
    <text x="0" y="114" class="t">기기 재현 그림 · 책 표지는 실물 비율 (예외)</text>
  </g>

  <g transform="translate(640,446)">
    <text x="0" y="0" class="k">ACTIONS · 영역당 강조 하나</text>
    <g transform="translate(0,14)">
      <rect width="118" height="30" rx="8" fill="#C7751F"/>
      <text x="59" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Apply to Reader</text>
      <text x="0" y="48" class="m">주 · borderedProminent</text>
      <rect x="168" width="76" height="30" rx="8" fill="#1B1F1D" fill-opacity="0.07"/>
      <text x="206" y="20" text-anchor="middle" font-size="12" fill="#A3611A">Cancel</text>
      <text x="168" y="48" class="m">보조 · bordered</text>
      <text x="290" y="20" font-size="12" fill="#A3611A">Hide</text>
      <text x="290" y="48" class="m">3차 · borderless</text>
      <rect x="414" y="-1" width="32" height="32" rx="8" fill="none" stroke="#C7751F" stroke-dasharray="3 2"/>
      <rect x="420" y="5" width="20" height="20" rx="4" fill="#1B1F1D" fill-opacity="0.12"/>
      <text x="414" y="48" class="m">아이콘 32/44</text>
    </g>
    <text x="0" y="96" class="t">삭제는 role: .destructive로 메뉴·확인 안에 두고 대상 이름을 말한다.</text>
    <text x="0" y="114" class="t">주 행동이 불가능하면 비활성만 하지 말고 이유와 필요한 행동을 옆에 쓴다.</text>
  </g>
</svg>

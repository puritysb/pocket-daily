<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', sans-serif">
  <title>Pocket Daily screen archetypes</title>
  <defs>
    <style>
      .frame { fill: #F9F8F4; stroke: rgba(0,0,0,0.12); }
      .panel { fill: #FFFFFF; stroke: rgba(0,0,0,0.11); }
      .stage { fill: #ECEAE2; }
      .ink { fill: #1B1F1D; }
      .soft { fill: #1B1F1D; opacity: 0.16; }
      .faint { fill: #1B1F1D; opacity: 0.08; }
      .accent { fill: #C7751F; }
      .accentSoft { fill: #C7751F; opacity: 0.15; }
      .signal { fill: #217847; }
      .caution { fill: #A85400; }
      .zone { fill: none; stroke: #C7751F; stroke-dasharray: 4 3; stroke-width: 1.2; }
      .h { font-size: 15px; font-weight: 600; fill: #1B1F1D; }
      .t { font-size: 12px; fill: #4A4F4C; }
      .k { font-size: 11px; fill: #8A6A3E; font-weight: 600; letter-spacing: 0.04em; }
      .btn { font-size: 10px; font-weight: 600; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="#F3F1EC"/>
  <text x="32" y="44" font-size="22" font-weight="600" fill="#1B1F1D">화면 틀</text>
  <text x="112" y="44" class="t">새 화면은 다섯 틀 중 하나에서 시작한다 · 앰버 = 영역의 주 행동 하나 · 점선 = 행동 영역</text>

  <!-- 1. List -->
  <g transform="translate(32,72)">
    <rect class="frame" width="208" height="380" rx="18"/>
    <rect class="ink" x="16" y="20" width="64" height="12" rx="3"/>
    <rect class="accent" x="166" y="16" width="26" height="20" rx="6"/>
    <rect class="soft" x="140" y="20" width="16" height="12" rx="3"/>
    <rect class="panel" x="16" y="50" width="176" height="56" rx="12"/>
    <rect class="stage" x="26" y="60" width="26" height="36" rx="3"/>
    <rect class="soft" x="62" y="66" width="84" height="8" rx="2"/>
    <rect class="accent" x="62" y="84" width="60" height="4" rx="2"/>
    <rect class="faint" x="62" y="84" width="118" height="4" rx="2"/>
    <rect class="panel" x="16" y="118" width="176" height="24" rx="8"/>
    <rect class="faint" x="26" y="127" width="70" height="6" rx="2"/>
    <g>
      <rect class="stage" x="16" y="156" width="52" height="74" rx="4"/>
      <rect class="stage" x="78" y="156" width="52" height="74" rx="4"/>
      <rect class="stage" x="140" y="156" width="52" height="74" rx="4"/>
      <rect class="soft" x="16" y="236" width="44" height="6" rx="2"/>
      <rect class="soft" x="78" y="236" width="40" height="6" rx="2"/>
      <rect class="soft" x="140" y="236" width="46" height="6" rx="2"/>
      <rect class="stage" x="16" y="256" width="52" height="74" rx="4"/>
      <rect class="stage" x="78" y="256" width="52" height="74" rx="4"/>
      <rect class="stage" x="140" y="256" width="52" height="74" rx="4"/>
    </g>
    <rect class="zone" x="160" y="11" width="38" height="30" rx="8"/>
    <text x="0" y="410" class="k">LIST · 목록</text>
    <text x="0" y="430" class="h">서재 · 기사 · 보관함</text>
    <text x="0" y="452" class="t">헤더 → 이어 읽기 → 검색 → 격자</text>
    <text x="0" y="470" class="t">추가는 헤더 오른쪽, 항목 행동은</text>
    <text x="0" y="488" class="t">항목 메뉴 안에 둔다.</text>
  </g>

  <!-- 2. Hub -->
  <g transform="translate(264,72)">
    <rect class="frame" width="208" height="380" rx="18"/>
    <rect class="ink" x="16" y="20" width="76" height="12" rx="3"/>
    <rect class="soft" x="172" y="20" width="16" height="12" rx="3"/>
    <rect class="panel" x="16" y="48" width="176" height="104" rx="12"/>
    <rect fill="#1B2120" x="28" y="60" width="38" height="54" rx="6"/>
    <rect fill="#F0EDDB" x="32" y="64" width="30" height="40" rx="2"/>
    <circle class="signal" cx="80" cy="66" r="4"/>
    <rect class="soft" x="90" y="62" width="70" height="8" rx="2"/>
    <rect class="faint" x="80" y="80" width="90" height="6" rx="2"/>
    <rect class="accent" x="28" y="122" width="96" height="22" rx="8"/>
    <text x="40" y="137" class="btn">Reader settings</text>
    <rect class="panel" x="132" y="122" width="48" height="22" rx="8"/>
    <rect class="zone" x="22" y="117" width="164" height="32" rx="10"/>
    <rect class="panel" x="16" y="164" width="176" height="30" rx="8"/>
    <path class="caution" d="M30 186 l7 -12 l7 12 z"/>
    <rect class="soft" x="52" y="175" width="104" height="7" rx="2"/>
    <rect class="panel" x="16" y="206" width="84" height="56" rx="12"/>
    <rect class="panel" x="108" y="206" width="84" height="56" rx="12"/>
    <rect class="soft" x="28" y="218" width="18" height="18" rx="5"/>
    <rect class="soft" x="120" y="218" width="18" height="18" rx="5"/>
    <rect class="faint" x="28" y="244" width="56" height="6" rx="2"/>
    <rect class="faint" x="120" y="244" width="56" height="6" rx="2"/>
    <rect class="ink" x="16" y="280" width="64" height="9" rx="2"/>
    <rect class="panel" x="16" y="298" width="176" height="64" rx="12"/>
    <rect class="faint" x="28" y="312" width="130" height="6" rx="2"/>
    <rect class="faint" x="28" y="330" width="110" height="6" rx="2"/>
    <rect class="faint" x="28" y="346" width="120" height="6" rx="2"/>
    <text x="0" y="410" class="k">HUB · 허브</text>
    <text x="0" y="430" class="h">내 리더</text>
    <text x="0" y="452" class="t">기기 카드 → 조치할 작업 →</text>
    <text x="0" y="470" class="t">목적지 → 보관함. 주 행동은</text>
    <text x="0" y="488" class="t">기기 카드 안에 하나만.</text>
  </g>

  <!-- 3. Editor -->
  <g transform="translate(496,72)">
    <rect class="frame" width="208" height="380" rx="18"/>
    <rect class="ink" x="16" y="20" width="92" height="12" rx="3"/>
    <rect class="panel" x="16" y="44" width="176" height="24" rx="8"/>
    <rect class="accentSoft" x="18" y="46" width="58" height="20" rx="6"/>
    <rect class="soft" x="30" y="53" width="34" height="6" rx="2"/>
    <rect class="faint" x="88" y="53" width="34" height="6" rx="2"/>
    <rect class="faint" x="146" y="53" width="34" height="6" rx="2"/>
    <rect class="stage" x="16" y="78" width="176" height="128" rx="12"/>
    <rect fill="#1B2120" x="70" y="88" width="68" height="108" rx="9"/>
    <rect fill="#F0EDDB" x="76" y="94" width="56" height="86" rx="2"/>
    <rect class="soft" x="82" y="102" width="40" height="5" rx="1"/>
    <rect class="faint" x="82" y="114" width="44" height="18" rx="2"/>
    <rect class="faint" x="82" y="138" width="44" height="18" rx="2"/>
    <g>
      <rect class="panel" x="16" y="218" width="176" height="94" rx="12"/>
      <rect class="soft" x="28" y="232" width="54" height="7" rx="2"/>
      <rect class="faint" x="132" y="230" width="48" height="12" rx="6"/>
      <rect x="16" y="249" width="176" height="1" fill="rgba(0,0,0,0.11)"/>
      <rect class="soft" x="28" y="261" width="70" height="7" rx="2"/>
      <rect class="accent" x="160" y="258" width="20" height="12" rx="6"/>
      <rect x="16" y="280" width="176" height="1" fill="rgba(0,0,0,0.11)"/>
      <rect class="soft" x="28" y="292" width="46" height="7" rx="2"/>
      <rect class="faint" x="120" y="294" width="60" height="4" rx="2"/>
    </g>
    <rect class="panel" x="8" y="324" width="192" height="44" rx="12"/>
    <circle cx="24" cy="346" r="5" fill="none" stroke="#C7751F" stroke-dasharray="2 2" stroke-width="1.5"/>
    <rect class="soft" x="36" y="342" width="56" height="7" rx="2"/>
    <rect class="accent" x="104" y="334" width="88" height="24" rx="8"/>
    <text x="113" y="350" class="btn">Apply to Reader</text>
    <rect class="zone" x="4" y="320" width="200" height="52" rx="14"/>
    <text x="0" y="410" class="k">EDITOR · 편집기</text>
    <text x="0" y="430" class="h">Reader settings · 카드</text>
    <text x="0" y="452" class="t">범위 → 미리보기 + 컨트롤 →</text>
    <text x="0" y="470" class="t">적용 바. 상태는 Apply 옆,</text>
    <text x="0" y="488" class="t">680pt부터 나란히.</text>
  </g>

  <!-- 4. Task sheet -->
  <g transform="translate(728,72)">
    <rect class="frame" width="208" height="380" rx="18"/>
    <rect width="208" height="380" rx="18" fill="#1B1F1D" opacity="0.18"/>
    <rect x="0" y="40" width="208" height="340" rx="18" fill="#F9F8F4"/>
    <rect class="faint" x="88" y="48" width="32" height="4" rx="2"/>
    <rect class="soft" x="16" y="66" width="34" height="8" rx="2"/>
    <rect class="ink" x="70" y="64" width="68" height="11" rx="3"/>
    <rect class="panel" x="16" y="92" width="176" height="52" rx="12"/>
    <rect class="stage" x="26" y="100" width="24" height="36" rx="3"/>
    <rect class="soft" x="60" y="106" width="96" height="7" rx="2"/>
    <rect class="faint" x="60" y="120" width="70" height="6" rx="2"/>
    <circle class="accent" cx="44" cy="166" r="6"/>
    <rect class="faint" x="54" y="165" width="40" height="2"/>
    <circle class="faint" cx="104" cy="166" r="6"/>
    <rect class="faint" x="114" y="165" width="40" height="2"/>
    <circle class="faint" cx="164" cy="166" r="6"/>
    <rect class="soft" x="16" y="190" width="150" height="7" rx="2"/>
    <rect class="faint" x="16" y="206" width="170" height="6" rx="2"/>
    <rect class="faint" x="16" y="220" width="130" height="6" rx="2"/>
    <rect class="accent" x="16" y="316" width="176" height="34" rx="10"/>
    <text x="64" y="337" class="btn" font-size="12">Connect Reader…</text>
    <rect class="zone" x="10" y="310" width="188" height="46" rx="13"/>
    <text x="104" y="300" text-anchor="middle" font-size="10" fill="#8A6A3E">→ 연결 후 같은 자리에 “Send 1 Book”</text>
    <text x="0" y="410" class="k">TASK SHEET · 작업 시트</text>
    <text x="0" y="430" class="h">책 보내기 · 연결 · 업데이트</text>
    <text x="0" y="452" class="t">대상과 수량 → 단계 → 안내.</text>
    <text x="0" y="470" class="t">주 행동은 단계마다 이름만</text>
    <text x="0" y="488" class="t">바뀌고 자리는 고정.</text>
  </g>

  <!-- 5. Focus -->
  <g transform="translate(960,72)">
    <rect width="208" height="380" rx="18" fill="#F0EDDB" stroke="rgba(0,0,0,0.12)"/>
    <rect class="soft" x="24" y="40" width="120" height="7" rx="2"/>
    <g class="faint">
      <rect x="24" y="68" width="160" height="5" rx="2"/>
      <rect x="24" y="82" width="152" height="5" rx="2"/>
      <rect x="24" y="96" width="160" height="5" rx="2"/>
      <rect x="24" y="110" width="140" height="5" rx="2"/>
      <rect x="24" y="124" width="158" height="5" rx="2"/>
      <rect x="24" y="148" width="160" height="5" rx="2"/>
      <rect x="24" y="162" width="148" height="5" rx="2"/>
      <rect x="24" y="176" width="160" height="5" rx="2"/>
      <rect x="24" y="190" width="120" height="5" rx="2"/>
      <rect x="24" y="214" width="160" height="5" rx="2"/>
      <rect x="24" y="228" width="156" height="5" rx="2"/>
      <rect x="24" y="242" width="160" height="5" rx="2"/>
      <rect x="24" y="256" width="134" height="5" rx="2"/>
      <rect x="24" y="280" width="160" height="5" rx="2"/>
      <rect x="24" y="294" width="150" height="5" rx="2"/>
      <rect x="24" y="308" width="100" height="5" rx="2"/>
    </g>
    <rect x="24" y="352" width="160" height="3" rx="1.5" fill="#1B1F1D" opacity="0.1"/>
    <rect class="accent" x="24" y="352" width="58" height="3" rx="1.5"/>
    <text x="0" y="410" class="k">FOCUS · 집중</text>
    <text x="0" y="430" class="h">앱 읽기</text>
    <text x="0" y="452" class="t">페이지가 화면 전체. 조작은</text>
    <text x="0" y="470" class="t">요청할 때만, 연결 안내는</text>
    <text x="0" y="488" class="t">끼어들지 않는다.</text>
  </g>

  <!-- breakpoints -->
  <g transform="translate(32,608)">
    <text x="0" y="0" class="k">너비 구간</text>
    <rect x="80" y="-11" width="340" height="16" rx="8" fill="#FFFFFF" stroke="rgba(0,0,0,0.11)"/>
    <text x="250" y="1" text-anchor="middle" class="t" font-size="11">&lt; 680pt · 한 열</text>
    <rect x="428" y="-11" width="300" height="16" rx="8" fill="#C7751F" opacity="0.15"/>
    <text x="578" y="1" text-anchor="middle" class="t" font-size="11">680pt · 편집기 미리보기와 컨트롤 나란히</text>
    <rect x="736" y="-11" width="400" height="16" rx="8" fill="#C7751F" opacity="0.3"/>
    <text x="936" y="1" text-anchor="middle" class="t" font-size="11">920pt · 사이드바 208pt + 본문 (최대 1100pt)</text>
    <text x="80" y="28" class="t" font-size="11">접근성 글자 크기는 너비와 관계없이 탭 내비게이션 · 한 열 · 화면 전체 스크롤</text>
  </g>
</svg>

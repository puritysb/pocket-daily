name: Pocket
options:
  bundleIdPrefix: org.crosspoint
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Pocket:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Support/Pocket-Info.plist
      properties:
        CFBundleDisplayName: Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Pocket uses Bluetooth to find and securely pair with your nearby reader.
        NSLocalNetworkUsageDescription: Pocket connects directly to your reader to sync books, study data, and firmware.
        NSBonjourServices:
          - _crosspoint._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Support/Pocket.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.crosspoint.pocket
        PRODUCT_NAME: Pocket
        TARGETED_DEVICE_FAMILY: "1,2"
  PocketMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Support/PocketMac-Info.plist
      properties:
        CFBundleDisplayName: Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Pocket uses Bluetooth to find and securely pair with your nearby reader.
        NSLocalNetworkUsageDescription: Pocket connects directly to your reader to sync books, study data, and firmware.
        NSBonjourServices:
          - _crosspoint._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Support/PocketMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.crosspoint.pocket
        PRODUCT_NAME: Pocket
        CODE_SIGN_ENTITLEMENTS: Support/PocketMac.entitlements
  PocketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Pocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.crosspoint.pocket.tests

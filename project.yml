name: Pocket
options:
  bundleIdPrefix: io.github.puritysb
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SYSTEM_HEADER_SEARCH_PATHS: "$(inherited) $(SDKROOT)/usr/include/libxml2"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: QF36NDHYHD
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Pocket:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Support/PocketUIHost/PIN.json
        buildPhase: resources
      - path: Support/PocketUIHost/PROVENANCE.json
        buildPhase: resources
      - path: Support/PreviewFont
        type: folder
        buildPhase: resources
      - path: Support/ReaderEngine
        type: folder
        buildPhase: resources
      - path: Support/ReaderFonts
        type: folder
        buildPhase: resources
    dependencies:
      - target: PocketShare
        embed: true
      - framework: Support/PocketUIHost/PocketUIHost.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - sdk: libxml2.tbd
    preBuildScripts:
      - name: Verify Host Renderer
        script: /usr/bin/python3 "$SRCROOT/scripts/host_renderer_artifact.py" verify "$SRCROOT/Support/PocketUIHost"
        inputFiles:
          - $(SRCROOT)/scripts/host_renderer_artifact.py
          - $(SRCROOT)/Support/PocketUIHost
        inputFileLists:
          - $(SRCROOT)/Support/PocketUIHost/RendererInputs.xcfilelist
        basedOnDependencyAnalysis: false
    info:
      path: Support/Pocket-Info.plist
      properties:
        CFBundleDisplayName: Pocket Daily
        CFBundleName: Pocket Daily
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: Text document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, net.daringfireball.markdown]
        LSSupportsOpeningDocumentsInPlace: false
        NSBluetoothAlwaysUsageDescription: Pocket Daily uses Bluetooth to find and securely pair with your nearby reader, and to keep your reading places in step with that paired reader.
        NSLocalNetworkUsageDescription: Pocket Daily connects directly to your X3/X4 reader to send books, screens, and firmware.
        NSLocationWhenInUseUsageDescription: Pocket Daily uses location permission only to find and join your nearby reader's temporary Wi-Fi network.
        NSCalendarsFullAccessUsageDescription: Pocket Daily reads today's events only when you turn on calendar events, to show them on your reader. They are sent only to your reader over your local connection.
        NSBonjourServices:
          - _crosspoint._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Support/Pocket.entitlements
      properties:
        com.apple.security.application-groups: [group.bound.serendipity.pocket.daily]
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.weatherkit: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: bound.serendipity.pocket.daily
        PRODUCT_NAME: Pocket
        TARGETED_DEVICE_FAMILY: "1,2"
  PocketMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Support/PocketUIHost/PIN.json
        buildPhase: resources
      - path: Support/PocketUIHost/PROVENANCE.json
        buildPhase: resources
      - path: Support/PreviewFont
        type: folder
        buildPhase: resources
      - path: Support/ReaderEngine
        type: folder
        buildPhase: resources
      - path: Support/ReaderFonts
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Support/PocketUIHost/PocketUIHost.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - sdk: libxml2.tbd
    preBuildScripts:
      - name: Verify Host Renderer
        script: /usr/bin/python3 "$SRCROOT/scripts/host_renderer_artifact.py" verify "$SRCROOT/Support/PocketUIHost"
        inputFiles:
          - $(SRCROOT)/scripts/host_renderer_artifact.py
          - $(SRCROOT)/Support/PocketUIHost
        inputFileLists:
          - $(SRCROOT)/Support/PocketUIHost/RendererInputs.xcfilelist
        basedOnDependencyAnalysis: false
    info:
      path: Support/PocketMac-Info.plist
      properties:
        CFBundleDisplayName: Pocket Daily
        CFBundleName: Pocket Daily
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.books
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: Text document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, net.daringfireball.markdown]
        NSBluetoothAlwaysUsageDescription: Pocket Daily uses Bluetooth to find and securely pair with your nearby reader, and to keep your reading places in step with that paired reader.
        NSLocalNetworkUsageDescription: Pocket Daily connects directly to your X3/X4 reader to send books, screens, and firmware.
        NSLocationUsageDescription: Pocket Daily uses location permission only to find and join your nearby reader's temporary Wi-Fi network.
        NSCalendarsFullAccessUsageDescription: Pocket Daily reads today's events only when you turn on calendar events, to show them on your reader. They are sent only to your reader over your local connection.
        NSBonjourServices:
          - _crosspoint._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Support/PocketMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
        com.apple.security.personal-information.calendars: true
        com.apple.developer.weatherkit: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: bound.serendipity.pocket.daily
        PRODUCT_NAME: Pocket
        CODE_SIGN_ENTITLEMENTS: Support/PocketMac.entitlements
  PocketShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Articles/ArticleRecord.swift
      - path: Sources/Articles/ArticleExtraction.swift
      - path: Sources/Articles/ArticleCaptureView.swift
    dependencies:
      - sdk: libxml2.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bound.serendipity.pocket.daily.share
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Support/PocketShare.entitlements
      properties:
        com.apple.security.application-groups: [group.bound.serendipity.pocket.daily]
    info:
      path: Support/PocketShare-Info.plist
      properties:
        CFBundleDisplayName: Pocket Daily
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  PocketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Pocket
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: bound.serendipity.pocket.daily.tests
  PocketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Pocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bound.serendipity.pocket.daily.uitests
        GENERATE_INFOPLIST_FILE: YES
  PocketMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacTests
    dependencies:
      - target: PocketMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bound.serendipity.pocket.daily.mactests
        GENERATE_INFOPLIST_FILE: YES
        # The macOS app target is named PocketMac but ships as Pocket.app, so the
        # test host cannot be derived from the target name.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pocket.app/Contents/MacOS/Pocket
        BUNDLE_LOADER: $(TEST_HOST)

# Declared explicitly so both platforms have a test action: XcodeGen's generated
# PocketMac scheme did not pick up the macOS unit-test bundle on its own.
schemes:
  Pocket:
    build:
      targets:
        Pocket: all
    test:
      targets:
        - PocketTests
        - PocketUITests
  PocketMac:
    build:
      targets:
        PocketMac: all
    test:
      targets:
        - PocketMacTests
